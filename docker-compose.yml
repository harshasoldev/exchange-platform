version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    container_name: nova-postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nova} -d ${DB_NAME:-nova_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_DB: ${DB_NAME:-nova_admin}
      POSTGRES_USER: ${DB_USER:-nova}
      POSTGRES_PASSWORD: ${DB_PASS:-nova_secret_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    logging: *default-logging
    networks:
      - nova-network

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    container_name: nova-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    logging: *default-logging
    networks:
      - nova-network

  # ─── Backend (NestJS) ───
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
    container_name: nova-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${APP_PORT:-8000}
      DATABASE_URL: postgresql://${DB_USER:-nova}:${DB_PASS:-nova_secret_2026}@postgres:5432/${DB_NAME:-nova_admin}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-nova-jwt-secret-2026}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - ./packages/backend/src:/app/src
      - backend_node_modules:/app/node_modules
    logging: *default-logging
    networks:
      - nova-network

  # ─── Nginx ───
  nginx:
    image: nginx:alpine
    container_name: nova-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    logging: *default-logging
    networks:
      - nova-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_node_modules:
  nginx_logs:
    driver: local

networks:
  nova-network:
    driver: bridge
